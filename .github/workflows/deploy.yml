name: Deploy to GitHub Pages

# Production deploys only happen from main. Requires Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  # Daily rebuild keeps build-time data (holder count) fresh. GitHub disables scheduled workflows after 60 days
  # without repository activity – re-enable it under Actions → "Deploy to GitHub Pages" if that happens.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
